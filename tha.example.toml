# Copy to $XDG_CONFIG_HOME/tha/config.toml or ~/.config/tha/config.toml.
refresh_seconds = 5
metrics_refresh_seconds = 1 # CPU/memory target cadence; independent of inventory refresh.
context_order = [] # Exact names pinned first, e.g. ["Colima / default", "OrbStack"].
log_capacity = 5000
monochrome = false
log_wrap = true # Initial state; press w in the log pane to toggle at any time.
mouse = true # Clicks, wheel and scrollbars. Hold Shift to select terminal text, or set false.
exec_command = ["sh"] # Use ["bash", "-l"] if your image has bash instead.
max_exec_sessions = 4 # Includes exited sessions; F6 selects, :close-exec frees a slot (1–8).
save_preferences = true # Separate XDG state file; never stores logs or shells. Demo never writes state.

# Keys apply only in navigation; editors, confirmations, pickers, and shells keep raw keys.
# Full action list and examples: docs/keybindings.md. Restart Tha after changes.
# Custom keys override matching defaults; other defaults remain available.
[bindings]
"z" = "zoom"
"ctrl-left" = "previous-view"
"ctrl-right" = "next-view"
# To move fullscreen from z to x, replace the z line above with these two lines:
# "z" = "none"
# "x" = "zoom"
# "alt-j" = "down"
# "alt-k" = "up"
# "alt-n" = "focus-next"
# "alt-p" = "focus-previous"
# "F6" = "exec-sessions"
# "alt-f" = "filter-logs"
# "alt-c" = "metrics-cursor"
# "alt-s" = "stop" # Still opens a confirmation; never bypasses safety checks.

# Discovery still runs alongside these explicit connections.
# Docker API connections currently require a Unix socket. SSH/TLS contexts
# remain visible but are marked unsupported rather than downgraded to plaintext.
# [[connections]]
# name = "OrbStack"
# kind = "docker"
# endpoint = "unix:///Users/you/.orbstack/run/docker.sock"

# Native containerd requires nerdctl on PATH and access to the endpoint.
# [[connections]]
# name = "containerd / local"
# kind = "containerd"
# endpoint = "/run/containerd/containerd.sock"

# Copy to $XDG_CONFIG_HOME/tha/config.toml or ~/.config/tha/config.toml.
refresh_seconds = 5
history_retention_hours = 24 # How long the local service keeps metrics and events (1-720).
metrics_refresh_seconds = 1 # CPU/memory target cadence; independent of inventory refresh.
context_order = [] # Exact names pinned first, e.g. ["Colima / default", "OrbStack"].
log_capacity = 5000
monochrome = false
log_wrap = true # Initial state; press w in the log pane to toggle at any time.
mouse = true # Clicks, wheel and scrollbars. Hold Shift to select terminal text, or set false.
theme = "terminal" # Or catppuccin-mocha, gruvbox-dark, tokyo-night, nord. Press , to change live.
language = "en" # Or de. Separate from the keyboard layout below.
editor = "vim" # Or neovim, nano, vscode. Opens files for editing; press , to change it.
# vscode_path = "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code" # If code is not on PATH.
keyboard = "us" # Or german: adds - / + for the metrics range and F12 to leave a shell.
exec_command = ["sh"] # Use ["bash", "-l"] if your image has bash instead.
max_exec_sessions = 4 # Includes exited sessions; F6 selects, :close-exec frees a slot (1–8).
check_updates = false # Ask GitHub at startup whether a newer release exists.
save_preferences = true # Separate XDG state file; never stores logs or shells. Demo never writes state.

# Keys apply only in navigation; editors, confirmations, pickers, and shells keep raw keys.
# Full action list and examples: docs/keybindings.md. Changes apply within a few seconds.
# Custom keys override matching defaults; other defaults remain available.
[bindings]
"z" = "zoom"
"ctrl-left" = "previous-view"
"ctrl-right" = "next-view"
# To move fullscreen from z to x, replace the z line above with these two lines:
# "z" = "none"
# "x" = "zoom"
# "alt-j" = "down"
# "alt-k" = "up"
# "alt-n" = "focus-next"
# "alt-p" = "focus-previous"
# "F6" = "exec-sessions"
# "alt-f" = "filter-logs"
# "alt-c" = "metrics-cursor"
# "alt-s" = "stop" # Still opens a confirmation; never bypasses safety checks.

# Remote servers run `tha-agent`, which only allows an explicit list of Docker API calls.
# They can also be managed in the app: press . or type :servers. Those are saved in
# remotes.toml next to this file, and this file is never rewritten.
# remote_connect = "manual" # Or "startup". Manual sends nothing until you connect.
# [[remotes]]
# name = "prod"
# host = "10.0.0.5"
# user = "tha"
# identity_file = "~/.ssh/tha_prod"
# port = 22
# connect = "startup" # Overrides remote_connect for this server.
# metrics_refresh_seconds = 5

# Alerts are on by default, with these limits. See docs/guide.md.
# [alerts]
# enabled = true
# restart_count = 5
# restart_minutes = 10
# memory_percent = 90
# memory_minutes = 5
# oom_minutes = 10

# Discovery still runs alongside these explicit connections.
# Docker API connections require a Unix socket. SSH/TLS Docker contexts remain visible
# but are marked unsupported rather than downgraded to plaintext; use [[remotes]] for SSH.
# [[connections]]
# name = "OrbStack"
# kind = "docker"
# endpoint = "unix:///Users/you/.orbstack/run/docker.sock"

# Native containerd requires nerdctl on PATH and access to the endpoint.
# [[connections]]
# name = "containerd / local"
# kind = "containerd"
# endpoint = "/run/containerd/containerd.sock"

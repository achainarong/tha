name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: make check
      - run: make build
      - run: uv run --with pyte python scripts/smoke.py
      - run: uv run --with pyte python scripts/exec_smoke.py
      - run: uv run --with pyte python scripts/podman_smoke.py
      - run: uv run --with pyte python scripts/actions_smoke.py
      - run: uv run --with pyte python scripts/features_smoke.py
      - run: uv run --with pyte python scripts/daemon_smoke.py
      - run: uv run --with pyyaml python scripts/release_smoke.py
      - run: make release

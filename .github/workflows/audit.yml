name: Audit
# Separate from the checks a release runs: an advisory published today says something about
# dependencies, not about the commit being released, so it must not block one.
on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths: [Cargo.lock, deny.toml, .github/workflows/audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.89.0
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories sources

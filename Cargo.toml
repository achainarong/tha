[package]
name = "tha"
version = "0.23.0"
edition = "2024"
default-run = "tha"
rust-version = "1.88"
description = "Tha — a runtime-first container terminal UI"
license = "MIT"

[dependencies]
anyhow = "1"
bollard = "0.21.1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
crokey = "1.5.1"
futures-util = "0.3"
http-body-util = "0.1"
fs2 = "0.4"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "tokio"] }
libc = "0.2"
portable-pty = "0.9"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "sync", "time", "signal", "net"] }
toml = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"
tui-term = "0.3.4"
vt100 = "0.16.2"

[profile.release]
lto = "thin"
strip = true

[[bench]]
name = "performance"
harness = false
